<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Explorer - AI Art</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid rgba(255, 0, 255, 0.5);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
            z-index: 10;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .info div {
            margin-bottom: 5px;
            color: #ff00ff;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.8);
        }

        .info .value {
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 30px;
            border-radius: 30px;
            border: 2px solid rgba(255, 0, 255, 0.5);
            color: #fff;
            font-size: 11px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.3);
        }

        .controls strong {
            color: #ff00ff;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.8);
        }

        .mode-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px solid rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            z-index: 10;
        }

        .mode-switch button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 0 5px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .mode-switch button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.6);
        }

        .mode-switch button.active {
            background: linear-gradient(135deg, #ff00ff 0%, #00ffff 100%);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff00ff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 0, 255, 1);
            animation: pulse 1s ease-in-out infinite;
            z-index: 5;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="info">
        <div>🌀 FRACTAL EXPLORER</div>
        <div>Zoom: <span class="value" id="zoom">1.0x</span></div>
        <div>Iterations: <span class="value" id="iterations">100</span></div>
        <div>Mode: <span class="value" id="mode">Mandelbrot</span></div>
        <div>Render: <span class="value" id="renderTime">0ms</span></div>
    </div>

    <div class="mode-switch">
        <button id="mandelbrotBtn" class="active">Mandelbrot</button>
        <button id="juliaBtn">Julia Set</button>
    </div>

    <div class="controls">
        <strong>CLICK</strong> to zoom in | <strong>RIGHT CLICK</strong> to zoom out | <strong>DRAG</strong> to pan | <strong>R</strong> to reset | <strong>SPACE</strong> to animate Julia
    </div>

    <div class="loading" id="loading" style="display: none;">RENDERING...</div>

    <canvas id="canvas"></canvas>

    <script>
        // Canvas Setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Fractal Configuration
        const CONFIG = {
            MAX_ITERATIONS: 100,
            ESCAPE_RADIUS: 4,
            ZOOM_FACTOR: 2,
            COLOR_SMOOTHING: true,
            SUPER_SAMPLING: false // Set to true for higher quality (slower)
        };

        // Fractal State
        let state = {
            mode: 'mandelbrot', // 'mandelbrot' or 'julia'
            centerX: -0.5,
            centerY: 0,
            zoom: 1,
            juliaC: { real: -0.7, imag: 0.27015 },
            animateJulia: false,
            juliaTime: 0
        };

        // Mouse tracking
        let mouse = {
            x: 0,
            y: 0,
            down: false,
            startX: 0,
            startY: 0,
            dragStartCenterX: 0,
            dragStartCenterY: 0
        };

        // Color Palettes
        const palettes = {
            cosmic: [
                { pos: 0.0, r: 0, g: 0, b: 0 },
                { pos: 0.16, r: 32, g: 107, b: 203 },
                { pos: 0.42, r: 237, g: 255, b: 255 },
                { pos: 0.6425, r: 255, g: 170, b: 0 },
                { pos: 0.8575, r: 0, g: 2, b: 0 },
                { pos: 1.0, r: 0, g: 7, b: 100 }
            ],
            psychedelic: [
                { pos: 0.0, r: 255, g: 0, b: 255 },
                { pos: 0.25, r: 0, g: 255, b: 255 },
                { pos: 0.5, r: 255, g: 255, b: 0 },
                { pos: 0.75, r: 255, g: 0, b: 0 },
                { pos: 1.0, r: 255, g: 0, b: 255 }
            ]
        };

        let currentPalette = palettes.psychedelic;

        // Convert position to complex plane
        function screenToComplex(screenX, screenY) {
            const aspectRatio = canvas.width / canvas.height;
            const range = 3.5 / state.zoom;

            const real = state.centerX + (screenX / canvas.width - 0.5) * range * aspectRatio;
            const imag = state.centerY + (screenY / canvas.height - 0.5) * range;

            return { real, imag };
        }

        // Interpolate color from palette
        function getColor(t) {
            t = t % 1;

            // Find the two colors to interpolate between
            let color1 = currentPalette[0];
            let color2 = currentPalette[1];

            for (let i = 0; i < currentPalette.length - 1; i++) {
                if (t >= currentPalette[i].pos && t <= currentPalette[i + 1].pos) {
                    color1 = currentPalette[i];
                    color2 = currentPalette[i + 1];
                    break;
                }
            }

            // Interpolate
            const range = color2.pos - color1.pos;
            const localT = (t - color1.pos) / range;

            const r = Math.floor(color1.r + (color2.r - color1.r) * localT);
            const g = Math.floor(color1.g + (color2.g - color1.g) * localT);
            const b = Math.floor(color1.b + (color2.b - color1.b) * localT);

            return { r, g, b };
        }

        // Mandelbrot iteration
        function mandelbrot(cReal, cImag) {
            let zReal = 0;
            let zImag = 0;
            let iteration = 0;

            while (iteration < CONFIG.MAX_ITERATIONS) {
                const zReal2 = zReal * zReal;
                const zImag2 = zImag * zImag;

                if (zReal2 + zImag2 > CONFIG.ESCAPE_RADIUS) {
                    if (CONFIG.COLOR_SMOOTHING) {
                        // Smooth coloring
                        const log_zn = Math.log(zReal2 + zImag2) / 2;
                        const nu = Math.log(log_zn / Math.log(2)) / Math.log(2);
                        return iteration + 1 - nu;
                    }
                    return iteration;
                }

                const newZReal = zReal2 - zImag2 + cReal;
                const newZImag = 2 * zReal * zImag + cImag;

                zReal = newZReal;
                zImag = newZImag;
                iteration++;
            }

            return CONFIG.MAX_ITERATIONS;
        }

        // Julia set iteration
        function julia(zReal, zImag, cReal, cImag) {
            let iteration = 0;

            while (iteration < CONFIG.MAX_ITERATIONS) {
                const zReal2 = zReal * zReal;
                const zImag2 = zImag * zImag;

                if (zReal2 + zImag2 > CONFIG.ESCAPE_RADIUS) {
                    if (CONFIG.COLOR_SMOOTHING) {
                        const log_zn = Math.log(zReal2 + zImag2) / 2;
                        const nu = Math.log(log_zn / Math.log(2)) / Math.log(2);
                        return iteration + 1 - nu;
                    }
                    return iteration;
                }

                const newZReal = zReal2 - zImag2 + cReal;
                const newZImag = 2 * zReal * zImag + cImag;

                zReal = newZReal;
                zImag = newZImag;
                iteration++;
            }

            return CONFIG.MAX_ITERATIONS;
        }

        // Render fractal
        function renderFractal() {
            const startTime = performance.now();
            document.getElementById('loading').style.display = 'block';

            // Use setTimeout to allow UI to update
            setTimeout(() => {
                const imageData = ctx.createImageData(canvas.width, canvas.height);
                const data = imageData.data;

                for (let y = 0; y < canvas.height; y++) {
                    for (let x = 0; x < canvas.width; x++) {
                        const { real, imag } = screenToComplex(x, y);

                        let iterations;
                        if (state.mode === 'mandelbrot') {
                            iterations = mandelbrot(real, imag);
                        } else {
                            iterations = julia(real, imag, state.juliaC.real, state.juliaC.imag);
                        }

                        const index = (y * canvas.width + x) * 4;

                        if (iterations === CONFIG.MAX_ITERATIONS) {
                            data[index] = 0;
                            data[index + 1] = 0;
                            data[index + 2] = 0;
                            data[index + 3] = 255;
                        } else {
                            const colorPos = iterations / CONFIG.MAX_ITERATIONS;
                            const color = getColor(colorPos * 3); // Multiply for more color cycles

                            data[index] = color.r;
                            data[index + 1] = color.g;
                            data[index + 2] = color.b;
                            data[index + 3] = 255;
                        }
                    }
                }

                ctx.putImageData(imageData, 0, 0);

                const renderTime = Math.round(performance.now() - startTime);
                document.getElementById('renderTime').textContent = renderTime + 'ms';
                document.getElementById('loading').style.display = 'none';

                updateUI();
            }, 10);
        }

        // Update UI
        function updateUI() {
            document.getElementById('zoom').textContent = state.zoom.toFixed(2) + 'x';
            document.getElementById('iterations').textContent = CONFIG.MAX_ITERATIONS;
            document.getElementById('mode').textContent = state.mode === 'mandelbrot' ? 'Mandelbrot' : 'Julia Set';
        }

        // Zoom in
        function zoomIn(x, y) {
            const { real, imag } = screenToComplex(x, y);
            state.centerX = real;
            state.centerY = imag;
            state.zoom *= CONFIG.ZOOM_FACTOR;

            // Increase iterations as we zoom in
            CONFIG.MAX_ITERATIONS = Math.min(500, Math.floor(100 + state.zoom * 20));

            renderFractal();
        }

        // Zoom out
        function zoomOut() {
            state.zoom /= CONFIG.ZOOM_FACTOR;
            CONFIG.MAX_ITERATIONS = Math.max(50, Math.floor(100 + state.zoom * 20));
            renderFractal();
        }

        // Reset view
        function reset() {
            if (state.mode === 'mandelbrot') {
                state.centerX = -0.5;
                state.centerY = 0;
            } else {
                state.centerX = 0;
                state.centerY = 0;
            }
            state.zoom = 1;
            CONFIG.MAX_ITERATIONS = 100;
            renderFractal();
        }

        // Switch mode
        function switchMode(mode) {
            state.mode = mode;
            reset();

            // Update buttons
            document.getElementById('mandelbrotBtn').classList.toggle('active', mode === 'mandelbrot');
            document.getElementById('juliaBtn').classList.toggle('active', mode === 'julia');
        }

        // Animate Julia set
        function animateJulia() {
            if (!state.animateJulia) return;

            state.juliaTime += 0.01;

            // Animate the Julia constant in a circular path
            state.juliaC.real = 0.7885 * Math.cos(state.juliaTime);
            state.juliaC.imag = 0.7885 * Math.sin(state.juliaTime);

            renderFractal();
            requestAnimationFrame(animateJulia);
        }

        // Event Listeners
        canvas.addEventListener('click', (e) => {
            if (!mouse.down) {
                zoomIn(e.clientX, e.clientY);
            }
        });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            zoomOut();
        });

        canvas.addEventListener('mousedown', (e) => {
            mouse.down = true;
            mouse.startX = e.clientX;
            mouse.startY = e.clientY;
            mouse.dragStartCenterX = state.centerX;
            mouse.dragStartCenterY = state.centerY;
        });

        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;

            if (mouse.down) {
                const dx = e.clientX - mouse.startX;
                const dy = e.clientY - mouse.startY;

                const aspectRatio = canvas.width / canvas.height;
                const range = 3.5 / state.zoom;

                state.centerX = mouse.dragStartCenterX - (dx / canvas.width) * range * aspectRatio;
                state.centerY = mouse.dragStartCenterY - (dy / canvas.height) * range;

                renderFractal();
            }
        });

        canvas.addEventListener('mouseup', () => {
            mouse.down = false;
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyR') {
                reset();
            } else if (e.code === 'Space' && state.mode === 'julia') {
                e.preventDefault();
                state.animateJulia = !state.animateJulia;
                if (state.animateJulia) {
                    animateJulia();
                }
            }
        });

        document.getElementById('mandelbrotBtn').addEventListener('click', () => {
            switchMode('mandelbrot');
        });

        document.getElementById('juliaBtn').addEventListener('click', () => {
            switchMode('julia');
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            renderFractal();
        });

        // Initial render
        renderFractal();

        // Pre-defined interesting locations
        const interestingLocations = [
            { x: -0.7, y: 0, zoom: 1, name: 'Overview' },
            { x: -0.7453, y: 0.1127, zoom: 100, name: 'Seahorse Valley' },
            { x: -0.1592, y: 1.0317, zoom: 200, name: 'Elephant Valley' },
            { x: -0.1011, y: 0.9563, zoom: 500, name: 'Triple Spiral' },
            { x: 0.42884, y: -0.231345, zoom: 1000, name: 'Siegel Disk' }
        ];
    </script>
</body>
</html>
