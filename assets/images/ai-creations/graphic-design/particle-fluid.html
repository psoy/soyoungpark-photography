<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Particle Simulation - AI Art</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            pointer-events: none;
            z-index: 10;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 30px;
            border: 2px solid rgba(0, 255, 255, 0.3);
            color: #fff;
            font-size: 12px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="info">
        <div>Particles: <span id="particleCount">0</span></div>
        <div>FPS: <span id="fps">0</span></div>
    </div>

    <div class="controls">
        <strong>MOVE</strong> mouse to interact | <strong>CLICK</strong> for black hole effect | <strong>SPACE</strong> to reset
    </div>

    <canvas id="canvas"></canvas>

    <script>
        // Canvas Setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Configuration
        const CONFIG = {
            PARTICLE_COUNT: 3500,
            PARTICLE_SIZE: 2,
            MOUSE_RADIUS: 150,
            MOUSE_FORCE: 0.5,
            BLACKHOLE_FORCE: 2.5,
            VELOCITY_DAMPING: 0.98,
            MAX_VELOCITY: 8,
            COLLISION_ENABLED: true,
            GRID_SIZE: 50
        };

        // Particle Class
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = CONFIG.PARTICLE_SIZE;
                this.hue = Math.random() * 60 + 160; // Cyan to purple range
                this.baseHue = this.hue;
            }

            update(mouse, isBlackHole) {
                // Mouse interaction
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < CONFIG.MOUSE_RADIUS && mouse.active) {
                    const force = isBlackHole ? -CONFIG.BLACKHOLE_FORCE : CONFIG.MOUSE_FORCE;
                    const angle = Math.atan2(dy, dx);
                    const strength = (1 - distance / CONFIG.MOUSE_RADIUS) * force;

                    this.vx += Math.cos(angle) * strength;
                    this.vy += Math.sin(angle) * strength;
                }

                // Apply velocity
                this.x += this.vx;
                this.y += this.vy;

                // Damping
                this.vx *= CONFIG.VELOCITY_DAMPING;
                this.vy *= CONFIG.VELOCITY_DAMPING;

                // Velocity limiting
                const velocity = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (velocity > CONFIG.MAX_VELOCITY) {
                    this.vx = (this.vx / velocity) * CONFIG.MAX_VELOCITY;
                    this.vy = (this.vy / velocity) * CONFIG.MAX_VELOCITY;
                }

                // Color based on velocity
                const velocityRatio = velocity / CONFIG.MAX_VELOCITY;
                this.hue = this.baseHue + velocityRatio * 100;

                // Bounce off walls
                if (this.x < 0 || this.x > canvas.width) {
                    this.vx *= -0.8;
                    this.x = Math.max(0, Math.min(canvas.width, this.x));
                }
                if (this.y < 0 || this.y > canvas.height) {
                    this.vy *= -0.8;
                    this.y = Math.max(0, Math.min(canvas.height, this.y));
                }
            }

            draw(ctx, density = 1) {
                const velocity = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                const velocityRatio = velocity / CONFIG.MAX_VELOCITY;

                // Size based on velocity
                const size = this.radius * (1 + velocityRatio * 1.5);

                // Brightness based on density
                const lightness = 50 + density * 30;
                const saturation = 80 + velocityRatio * 20;

                // Glow effect for fast particles
                if (velocityRatio > 0.3) {
                    ctx.shadowBlur = 15 * velocityRatio;
                    ctx.shadowColor = `hsl(${this.hue}, 100%, 60%)`;
                } else {
                    ctx.shadowBlur = 0;
                }

                ctx.fillStyle = `hsl(${this.hue}, ${saturation}%, ${lightness}%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Spatial Hash Grid for collision optimization
        class SpatialGrid {
            constructor(gridSize) {
                this.gridSize = gridSize;
                this.grid = new Map();
            }

            clear() {
                this.grid.clear();
            }

            getKey(x, y) {
                const gridX = Math.floor(x / this.gridSize);
                const gridY = Math.floor(y / this.gridSize);
                return `${gridX},${gridY}`;
            }

            insert(particle) {
                const key = this.getKey(particle.x, particle.y);
                if (!this.grid.has(key)) {
                    this.grid.set(key, []);
                }
                this.grid.get(key).push(particle);
            }

            getNearby(particle) {
                const nearby = [];
                const gridX = Math.floor(particle.x / this.gridSize);
                const gridY = Math.floor(particle.y / this.gridSize);

                // Check 9 cells (current + 8 neighbors)
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        const key = `${gridX + dx},${gridY + dy}`;
                        if (this.grid.has(key)) {
                            nearby.push(...this.grid.get(key));
                        }
                    }
                }
                return nearby;
            }

            getDensity(particle) {
                const nearby = this.getNearby(particle);
                let density = 0;
                const checkRadius = this.gridSize;

                for (let other of nearby) {
                    if (other === particle) continue;
                    const dx = particle.x - other.x;
                    const dy = particle.y - other.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < checkRadius) {
                        density += 1 - (distance / checkRadius);
                    }
                }

                return Math.min(density / 10, 1);
            }
        }

        // Mouse tracking
        const mouse = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            active: false,
            isBlackHole: false
        };

        // Particles array
        const particles = [];
        const spatialGrid = new SpatialGrid(CONFIG.GRID_SIZE);

        // Initialize particles
        function initParticles() {
            particles.length = 0;
            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                particles.push(new Particle(x, y));
            }
        }

        // Collision detection and response
        function handleCollisions() {
            if (!CONFIG.COLLISION_ENABLED) return;

            spatialGrid.clear();

            // Insert all particles into grid
            for (let particle of particles) {
                spatialGrid.insert(particle);
            }

            // Check collisions for each particle
            for (let particle of particles) {
                const nearby = spatialGrid.getNearby(particle);

                for (let other of nearby) {
                    if (particle === other) continue;

                    const dx = other.x - particle.x;
                    const dy = other.y - particle.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const minDistance = particle.radius + other.radius;

                    if (distance < minDistance && distance > 0) {
                        // Collision response
                        const angle = Math.atan2(dy, dx);
                        const targetX = particle.x + Math.cos(angle) * minDistance;
                        const targetY = particle.y + Math.sin(angle) * minDistance;

                        const ax = (targetX - other.x) * 0.05;
                        const ay = (targetY - other.y) * 0.05;

                        particle.vx -= ax;
                        particle.vy -= ay;
                        other.vx += ax;
                        other.vy += ay;
                    }
                }
            }
        }

        // FPS Counter
        let fps = 0;
        let frameCount = 0;
        let lastTime = performance.now();

        function updateFPS() {
            frameCount++;
            const currentTime = performance.now();

            if (currentTime - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = currentTime;
                document.getElementById('fps').textContent = fps;
            }
        }

        // Animation loop
        function animate() {
            // Trail effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update and draw particles
            for (let particle of particles) {
                particle.update(mouse, mouse.isBlackHole);
            }

            // Handle collisions
            handleCollisions();

            // Draw particles with density-based coloring
            spatialGrid.clear();
            for (let particle of particles) {
                spatialGrid.insert(particle);
            }

            for (let particle of particles) {
                const density = spatialGrid.getDensity(particle);
                particle.draw(ctx, density);
            }

            // Draw mouse cursor effect
            if (mouse.active) {
                const gradient = ctx.createRadialGradient(
                    mouse.x, mouse.y, 0,
                    mouse.x, mouse.y, CONFIG.MOUSE_RADIUS
                );

                if (mouse.isBlackHole) {
                    gradient.addColorStop(0, 'rgba(255, 0, 255, 0.3)');
                    gradient.addColorStop(0.5, 'rgba(255, 0, 255, 0.1)');
                    gradient.addColorStop(1, 'rgba(255, 0, 255, 0)');
                } else {
                    gradient.addColorStop(0, 'rgba(0, 255, 255, 0.2)');
                    gradient.addColorStop(0.5, 'rgba(0, 255, 255, 0.05)');
                    gradient.addColorStop(1, 'rgba(0, 255, 255, 0)');
                }

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, CONFIG.MOUSE_RADIUS, 0, Math.PI * 2);
                ctx.fill();
            }

            updateFPS();
            requestAnimationFrame(animate);
        }

        // Event Listeners
        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
        });

        canvas.addEventListener('mouseleave', () => {
            mouse.active = false;
            mouse.isBlackHole = false;
        });

        canvas.addEventListener('mousedown', () => {
            mouse.isBlackHole = true;
        });

        canvas.addEventListener('mouseup', () => {
            mouse.isBlackHole = false;
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                initParticles();
            }
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        });

        // Initialize and start
        initParticles();
        document.getElementById('particleCount').textContent = CONFIG.PARTICLE_COUNT;
        animate();
    </script>
</body>
</html>
